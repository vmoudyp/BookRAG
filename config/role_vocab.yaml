# BookRAG Domain Role Vocabulary
# Maps stable role_id → canonical role name + known aliases.
#
# Usage:
#   role_id       : stable identifier used as deduplication key in RoleAssignment.role_id
#   canonical     : preferred display name written back to RoleAssignment.role_name
#   aliases       : observed surface forms, abbreviations, or alternate spellings
#                   (case-insensitive matching at runtime)
#
# Extend this file as new roles are discovered during curation.

