# configs/default.yaml

pdf_path: TODO
save_path: TODO
parser: docling

llm:
  model_name: qwen3.5
  api_key: env
  api_base: https://starcore-llm.starcore.co.id/v1/gpt
  backend: openai
  max_tokens: 8000
  temperature: 0.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_workers: 4


vlm:
  model_name: /home/user/qwen-model/Qwen2-VL-2B-Instruct
  api_key: env
  api_base: https://starcore-llm.starcore.co.id/v1/vl
  temperature: 0.1
  max_tokens: 6000
  backend: gpt

index:
  chunk_size: 512
  overlap: 50

mineru:
  backend: vlm-sglang-client
  method: vlm
  server_url: http://localhost:30000
  lang: en

tree:
  node_keywords: True
  node_summary: True

graph:
  # Options: "llm" | "local" (spaCy English) | "hybrid" (BERT-only, no LLM for NER)
  extractor_type: "hybrid"
  local_model_name: "en_core_web_sm"
  # Hugging Face model ID or existing local model directory for Indonesian NER.
  # Public Hub IDs download on first use and are cached locally; local dirs support offline use.
  hybrid_ner_model: "cahya/bert-base-indonesian-NER"
  # Minimum BERT confidence score to accept an entity span (0.0–1.0)
  ner_confidence_threshold: 0.5
  image_description_force: False
  max_gleaning: 0
  text_extraction_scope: "body_text_leaves"
  # "basic" uses name-based deduplication only — no remote embedding or reranker calls.
  # Switch to "advanced" when a GPU-backed embedding + reranker service is available.
  refine_type: "basic"
  embedding_config:
    model_name: text-embedding-v3
    backend: openai
    api_key: env
    max_length: 4096
    device: "cpu"
    api_base: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
  reranker_config:
    model_name: /home/user/qwen-model/Qwen3-Reranker-4B
    max_length: 4096
    device: "cpu"
    backend: openai
    api_base: "https://starcore-llm.starcore.co.id/v1/reranker/v1"
    api_key: env


vdb:
  # mm_embedding requires CUDA; disabled for CPU-only local dev.
  mm_embedding: False
  vdb_dir_name: "Tree_vdb"
  collection_name: "TreeVDB"
  embedding_config:
    model_name: Alibaba-NLP/gme-Qwen2-VL-2B-Instruct
    device: "cpu"

ontology:
  enabled: false
  path: "./tree_ontology.yaml"
  mapping_threshold: 1.0
  allow_provisional_entities: true
  use_query_resolution: true

entity_resolution:
  enabled: false
  similarity_threshold: 0.85
  top_k: 1
  global_vdb_dir: "./indices"
  collection_name: "global_kg_collection"
  canonical_only: false
  sync_to_global_graph: false

falkordb:
  host: "r-6jissuruar.instance-yc6en3ndn.hc-dx5io0svq.asia-south1.gcp.f2e0a955bb84.cloud"
  port: 60480
  username: "falkordb"
  password: "3YJ36xM3piI3"
  graph_prefix: "bookrag"

rag_force_reprocess: True

rag:
  strategy: gbc
  varient: standard
  topk: 10
  sim_threshold: 0.3
  select_depth: 2
  max_retry: 2
  visual_sidecar_query_enabled: false
  visual_sidecar_query_topk: 3
  visual_sidecar_fusion_enabled: false
  visual_sidecar_fusion_weight: 1.0
  visual_sidecar_fusion_score_mode: max_norm
  visual_sidecar_fusion_min_score: 0.2
  reranker_config:
    model_name: /home/user/qwen-model/Qwen3-Reranker-4B
    max_length: 4096
    device: "cpu"
    backend: openai
    api_base: "https://starcore-llm.starcore.co.id/v1/reranker/v1"
    api_key: env
  mm_reranker_config:
    model_name: Alibaba-NLP/gme-Qwen2-VL-2B-Instruct
    device: "cuda:2"
